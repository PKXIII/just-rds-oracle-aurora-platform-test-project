name: terraform-ci

# Runs on every push/PR. Pure static analysis — fmt, validate, and two security
# scanners. No AWS credentials are used and no resources are ever created, so CI
# is free and safe to run on a fork.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (backend disabled)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  security:
    name: tfsec + checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scanners run on every push and surface findings, but don't block: the dev
      # profile is intentionally single-AZ / minimal, so some "production" rules
      # are expected to fire. Triage them via .checkov.yml rather than failing CI.
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true
          config_file: .checkov.yml

  plan:
    name: plan (dev, no apply)
    runs-on: ubuntu-latest
    needs: [validate]
    # Plan needs AWS creds to refresh state. Skipped unless the repo provides
    # read-only credentials; it never applies. Enable by adding repo secrets.
    if: ${{ vars.ENABLE_PLAN == 'true' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - run: terraform init
      - run: terraform plan -var-file=environments/dev.tfvars -no-color
